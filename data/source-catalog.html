    "role": "طراحی چارچوب و تحلیل",
    "sla": "۳ تا ۷ روز کاری برای هر دوره گزارش",
    "response": "۱ تا ۲ روز",
    "accept": "تحویل اقلام توافق‌شده، پوشش پرسش یا تصمیم تعریف‌شده و ثبت بازخورد مالک درخواست.",
    "tags": [
      "مدیریت کانال‌های فروش",
      "مدیریت کانال و فروش"
    ]
  }
]</script><script>
'use strict';
const seed=JSON.parse(document.getElementById('seed').textContent); const K='mci.market.ola.v2.';
const memory={};let storageAvailable=true;
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(K+k))??memory[k]??f}catch{storageAvailable=false;return memory[k]??f}};
const save=(k,v)=>{memory[k]=v;try{localStorage.setItem(K+k,JSON.stringify(v))}catch{storageAvailable=false}};
let services=read('services',seed),requests=read('requests',[]),settings=read('settings',{recipients:[],unit:'اداره توسعه بازار راهکارهای هوشمند'}),draft=read('draft',{}),page='home',selected=null,filter='',family='',step=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav=[['home','نمای کلی'],['catalog','کاتالوگ خدمات'],['guide','راهنمای انتخاب خدمت'],['new','ثبت درخواست'],['requests','درخواست‌های من'],['rules','نحوه همکاری'],['admin','تنظیمات محلی']];
function route(p){page=p;selected=null;draw();window.scrollTo(0,0)}
function persistDraft(){save('draft',draft)}
function draw(){document.getElementById('pageTitle').textContent=nav.find(x=>x[0]===page)?.[1]||'خدمت';document.getElementById('nav').innerHTML=nav.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="route('${p}')">${t}</button>`).join('');let a=document.getElementById('app');a.innerHTML=page==='home'?home():page==='catalog'?catalog():page==='guide'?guide():page==='new'?form():page==='requests'?requestList():page==='rules'?rules():admin();}
const familyNames=[...new Set(seed.map(x=>x.family))];
function home(){return `<div class="hero"><div><h1>از نیاز بازار تا تحویل مشخص</h1><p>خدمت مناسب را پیدا کنید، ورودی‌های لازم را ببینید و درخواست خود را با شرح مسئله و خروجی مورد انتظار ثبت کنید.</p></div><button onclick="route('new')">ثبت درخواست جدید</button></div><div class="section"><h2>شروع از کجا؟</h2></div><div class="cards"><div class="card" onclick="route('guide')"><span class="kicker">۱ · شناخت نیاز</span><h3>هنوز نام خدمت را نمی‌دانم</h3><p>از مسئله‌ای که دارید به خانواده خدمت برسید.</p></div><div class="card" onclick="route('catalog')"><span class="kicker">۲ · بررسی دامنه</span><h3>خدمت مشخصی می‌خواهم</h3><p>تعریف، ورودی، خروجی و مرز هر خدمت را بخوانید.</p></div><div class="card" onclick="route('requests')"><span class="kicker">۳ · پیگیری شخصی</span><h3>بریفم را آماده کرده‌ام</h3><p>پیش‌نویس‌های ذخیره‌شده را باز کنید و خروجی بگیرید.</p></div></div><div class="section"><h2>سبد خدمات</h2><span class="muted">${services.length} خدمت · ${familyNames.length} خانواده</span></div><div class="cards">${[['تحقیقات بازار','پرسش، شواهد و برآورد'],['توسعه بازار','راهبرد، ارزش پیشنهادی، محتوا و فعال‌سازی'],['مدیریت کانال‌های فروش','چارچوب کانال، فرصت و پایش']].map(([d,t])=>`<div class="card" onclick="filter='${d}';route('catalog')"><span class="kicker">${services.filter(x=>x.domain===d).length} خدمت</span><h3>${d}</h3><p>${t}</p></div>`).join('')}</div>`}
function catalog(){if(selected){let s=services.find(x=>x.code===selected);return detail(s)}let list=services.filter(x=>(!filter||x.domain===filter)&&(!family||x.family===family));return `<div class="section"><h2>کاتالوگ خدمات</h2><span class="muted" id="resultCount">${list.length} مورد</span></div><div class="toolbar"><input id="search" aria-label="جست‌وجوی خدمات" placeholder="جست‌وجو در نام، کد، مسئله یا خروجی…" oninput="renderCards()"><select id="domain" onchange="filter=this.value;family='';draw()"><option value="">همه حوزه‌ها</option>${[...new Set(services.map(x=>x.domain))].map(d=>`<option ${filter===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select id="family" onchange="family=this.value;renderCards()"><option value="">همه خانواده‌ها</option>${familyNames.map(d=>`<option ${family===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="cards" id="results"></div>`}
function renderCards(){let q=(document.getElementById('search')?.value||'').trim().toLowerCase(),d=document.getElementById('domain')?.value||filter,f=document.getElementById('family')?.value||family;let list=services.filter(s=>(!d||s.domain===d)&&(!f||s.family===f)&&(!q||[s.code,s.name,s.definition,s.when,s.output].join(' ').toLowerCase().includes(q)));document.getElementById('resultCount').textContent=list.length+' مورد';document.getElementById('results').innerHTML=list.length?list.map(s=>`<article class="card" tabindex="0" onclick="selected='${s.code}';draw()" onkeydown="if(event.key==='Enter'){selected='${s.code}';draw()}"><div class="row" style="justify-content:space-between"><span class="kicker">${esc(s.family)}</span><span class="code">${s.code}</span></div><h3>${esc(s.name)}</h3><p>${esc(s.when)}</p></article>`).join(''):'<div class="empty">خدمتی با این جست‌وجو پیدا نشد.</div>'}
function detail(s){return `<button class="ghost" onclick="selected=null;draw()">بازگشت به کاتالوگ</button><div class="panel detail" style="margin-top:16px"><span class="kicker">${esc(s.family)} · ${esc(s.code)}</span><h1>${esc(s.name)}</h1><div class="meta">${esc(s.domain)} | نقش اداره: ${esc(s.role)}</div><p>${esc(s.definition)}</p><dl><div><dt>چه زمانی درخواست شود؟</dt><dd>${esc(s.when)}</dd></div><div><dt>ورودی موردنیاز</dt><dd>${esc(s.input)}</dd></div><div><dt>تحویل‌دادنی</dt><dd>${esc(s.output)}</dd></div><div><dt>خارج از دامنه</dt><dd>${esc(s.excluded)}</dd></div><div class="full"><dt>زمان‌بندی و پذیرش</dt><dd>پاسخ اولیه پیشنهادی: ${esc(s.response)} · برآورد مرجع: ${esc(s.sla)}. زمان قطعی پس از ارزیابی ظرفیت و دامنه توافق می‌شود. ${esc(s.accept)}</dd></div></dl><button class="primary" onclick="draft.service='${s.code}';persistDraft();step=0;route('new')">درخواست این خدمت</button></div>`}
function guide(){let prompts=[['اندازه و جذابیت بازار','MR-06','MR-08'],['شناخت مشتری و مسئله او','MR-04','MR-09'],['ورود به بازار و پیشنهاد ارزش','CS-11','CS-17'],['شناسایی شریک و طراحی همکاری','BD-21','BD-23'],['جایگاه و پیام راهکار','BR-30','BR-32'],['محتوای معرفی و وبگاه','CN-39','CN-44'],['کمپین یا نمایشگاه','CM-47','EV-55'],['حساب و فرصت فروش','SL-63','CS-15']];return `<div class="section"><h2>نیاز شما به کدام خدمت نزدیک‌تر است؟</h2></div><p class="muted">این مسیر نقطه شروع است؛ انتخاب نهایی در بررسی درخواست انجام می‌شود.</p><div class="cards">${prompts.map(([t,a,b])=>`<div class="card" onclick="filter='';family='';selected='${a}';page='catalog';draw()"><span class="kicker">${a} · ${b}</span><h3>${t}</h3><p>${esc(services.find(x=>x.code===a)?.name)} و ${esc(services.find(x=>x.code===b)?.name)}</p></div>`).join('')}</div>`}
const fields=[['requester','نام درخواست‌کننده','text',true],['unit','نام طرح یا پروژه','text',true],['email','ایمیل سازمانی','email',true],['title','عنوان درخواست','text',true],['problem','مسئله و چرایی درخواست','textarea',true],['decision','این خروجی برای چه تصمیمی لازم است؟','textarea',true],['deliverable','خروجی مورد انتظار','textarea',true],['audience','مخاطب خروجی','text',true],['deadline','تاریخ موردنیاز و دلیل آن','text',true],['evidence','اطلاعات و مستندات موجود','textarea',false],['constraints','محدودیت‌ها و وابستگی‌های شناخته‌شده','textarea',false]];
function field([key,label,type,required]){let val=esc(draft[key]||'');return `<label class="${type==='textarea'?'wide':''}">${label}${required?' <span>*</span>':''}${type==='textarea'?`<textarea data-key="${key}" ${required?'required':''}>${val}</textarea>`:`<input data-key="${key}" type="${type}" value="${val}" ${required?'required':''}>`}</label>`}
function capture(){document.querySelectorAll('[data-key]').forEach(x=>draft[x.dataset.key]=x.value);persistDraft()}
function form(){let s=services.find(x=>x.code===draft.service);return `<div class="section"><h2>ثبت درخواست خدمت</h2></div><div class="steps"><span class="${step===0?'on':''}">۱ · انتخاب خدمت</span><span class="${step===1?'on':''}">۲ · شرح نیاز</span><span class="${step===2?'on':''}">۳ · بازبینی و خروجی</span></div>${step===0?`<div class="panel"><p>خدمت پیشنهادی را انتخاب کنید. اگر مطمئن نیستید، مسئله را در بریف توضیح دهید تا خدمت نهایی هنگام ارزیابی تعیین شود.</p><select id="pick" style="width:100%"><option value="">نامشخص؛ ارزیابی توسط اداره</option>${services.map(x=>`<option value="${x.code}" ${draft.service===x.code?'selected':''}>${x.code} · ${esc(x.name)}</option>`).join('')}</select><div id="pickHelp" class="notice">${s?esc(s.input):'مدارکی را که در اختیار دارید در مرحله بعد بنویسید.'}</div><button class="primary" onclick="draft.service=document.getElementById('pick').value;persistDraft();step=1;draw()">ادامه</button></div>`:step===1?`<div class="panel"><div class="notice">${s?`برای «${esc(s.name)}»: ${esc(s.input)}`:'شرح مسئله و تصمیم موردنظر برای ارزیابی خدمت ضروری است.'}</div><div class="formgrid" id="brief">${fields.map(field).join('')}</div><div id="validation" class="error"></div><div class="row" style="margin-top:18px"><button class="primary" onclick="nextStep()">بازبینی بریف</button><button class="ghost" onclick="capture();step=0;draw()">بازگشت</button><button class="ghost" onclick="capture();alert('پیش‌نویس در همین مرورگر ذخیره شد.')">ذخیره پیش‌نویس</button></div></div>`:`<div class="panel"><span class="kicker">پیش‌نمایش درخواست</span><h2>${esc(draft.title)}</h2><p class="muted">${s?esc(s.code+' · '+s.name):'خدمت در زمان ارزیابی تعیین شود'}</p><dl class="grid2">${fields.map(([k,l])=>`<div class="guide"><b>${l}</b>${esc(draft[k]||'ثبت نشده')}</div>`).join('')}</dl><div class="notice">ارسال نهایی به واحد مربوط، تخصیص ظرفیت و تعیین زمان تعهد پس از بررسی انسانی انجام می‌شود. دانلود فایل به معنی ثبت سازمانی درخواست نیست.</div><div class="row"><button class="primary" onclick="finalize()">ثبت در این مرورگر و دانلود بریف</button><button class="ghost" onclick="step=1;draw()">اصلاح اطلاعات</button></div></div>`}`}
function nextStep(){capture();let missing=fields.filter(x=>x[3]&&!String(draft[x[0]]||'').trim());if(missing.length){document.getElementById('validation').textContent='این موارد را کامل کنید: '+missing.map(x=>x[1]).join('، ');return}let email=String(draft.email).trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('validation').textContent='نشانی ایمیل معتبر وارد کنید.';return}step=2;draw()}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function printable(r){let s=services.find(x=>x.code===r.service),rows=fields.map(([k,l])=>`<tr><th>${esc(l)}</th><td>${esc(r[k]||'')}</td></tr>`).join('');return `<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>بریف ${esc(r.id)}</title><style>body{font:15px/2 Tahoma,sans-serif;color:#17324f;max-width:850px;margin:35px auto;padding:20px}h1{color:#10294b}table{width:100%;border-collapse:collapse}td,th{border:1px solid #d8e5ee;padding:9px;text-align:right;vertical-align:top;white-space:pre-wrap}th{width:29%;background:#f1f7fb}small{color:#668}</style><h1>بریف درخواست خدمت توسعه بازار</h1><p>شماره محلی: ${esc(r.id)} | تاریخ ایجاد: ${esc(r.created)} | خدمت: ${esc(s?s.code+' · '+s.name:'نیازمند ارزیابی')}</p><table>${rows}</table><p><small>این فایل خروجی درخواست‌کننده است و تأیید دامنه، ظرفیت یا زمان ارائه خدمت محسوب نمی‌شود.</small></p></html>`}
function finalize(){let r={...draft,id:'MB-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),created:new Date().toLocaleString('fa-IR'),status:'آماده ارسال'};requests.unshift(r);save('requests',requests);download('brief-'+r.id+'.html',printable(r),'text/html;charset=utf-8');draft={};persistDraft();step=0;route('requests')}
function requestList(){return `<div class="section"><h2>درخواست‌های من</h2><button class="primary" onclick="route('new')">درخواست جدید</button></div><div class="notice">${storageAvailable?'':'ذخیره دائمی در این محیط مسدود است؛ پس از ساخت درخواست، فایل بریف را نگه دارید. '}این فهرست فقط در همین مرورگر ذخیره می‌شود. برای انتقال یا نگهداری رسمی، فایل بریف را دانلود و از مسیر سازمانی ارسال کنید.</div><div class="panel">${requests.length?requests.map(r=>`<div class="request"><div><strong>${esc(r.title)}</strong><small>${esc(r.id)} · ${esc(r.created)} · ${esc(r.unit)}</small></div><div class="row"><span class="badge">${esc(r.status)}</span><button class="ghost" onclick="exportRequest('${r.id}')">دریافت بریف</button><button class="ghost" onclick="emailRequest('${r.id}')">آماده‌سازی ایمیل</button></div></div>`).join(''):'<div class="empty">هنوز درخواستی در این مرورگر ثبت نشده است.</div>'}</div>`}
function exportRequest(id){let r=requests.find(x=>x.id===id);if(r)download('brief-'+r.id+'.html',printable(r),'text/html;charset=utf-8')}
function emailRequest(id){let r=requests.find(x=>x.id===id);if(!r)return;if(!settings.recipients.length){alert('ابتدا نشانی گیرندگان را در تنظیمات محلی وارد کنید.');return}let body=`درخواست خدمت توسعه بازار\nشناسه: ${r.id}\nعنوان: ${r.title}\nطرح: ${r.unit}\nدرخواست‌کننده: ${r.requester}\nخدمت: ${r.service||'تعیین در ارزیابی'}\nمسئله: ${r.problem}\nخروجی: ${r.deliverable}\nزمان موردنیاز: ${r.deadline}\n\nلطفاً فایل بریف دانلودشده را به ایمیل پیوست کنید.`;let url=`mailto:${settings.recipients.join(',')}?subject=${encodeURIComponent('درخواست خدمت توسعه بازار | '+r.id)}&body=${encodeURIComponent(body)}`;if(url.length>1800){alert('متن ایمیل بلند است. فایل بریف را جداگانه به گیرندگان تعریف‌شده ارسال کنید.');return}location.href=url}
function rules(){return `<div class="section"><h2>چارچوب همکاری</h2></div><div class="grid2"><div class="panel"><h3>مالکیت و مسئولیت</h3><p>اداره توسعه بازار مسئول تحلیل بازار، چارچوب تجاری، ارزش پیشنهادی، پیام و خروجی توافق‌شده است. طرح مسئول صحت اطلاعات محصول، قابلیت‌ها، محدودیت‌های فنی و تأیید تخصصی است. اجرای فنی، خرید رسانه، تولید، چاپ و قرارداد با واحد یا مجری تعیین‌شده انجام می‌شود.</p></div><div class="panel"><h3>مسیر درخواست</h3><p>ثبت بریف ← بررسی کامل بودن ورودی و تعیین خدمت ← توافق دامنه، اولویت، ظرفیت، زمان و معیار پذیرش ← اجرا و بازبینی ← تحویل و پذیرش. درخواست فوری یا تغییر دامنه به ارزیابی مجدد ظرفیت و زمان نیاز دارد.</p></div><div class="panel"><h3>توقف ساعت خدمت</h3><p>انتظار برای اطلاعات محصول، تأیید مالک درخواست، دسترسی به داده یا تصمیم واحد دیگر از زمان انجام کسر می‌شود؛ تاریخ توقف و ازسرگیری باید در پرونده درخواست ثبت شود.</p></div><div class="panel"><h3>مرز تعهد</h3><p>تعهد اداره بر تحویل توافق‌شده است؛ تحقق فروش، تأیید قرارداد، تولید فنی و نتیجه نهایی کسب‌وکار به عوامل و مالکان دیگری وابسته‌اند. برآوردهای کاتالوگ مبنای گفت‌وگو هستند و پس از پذیرش درخواست نهایی می‌شوند.</p></div></div>`}
function admin(){return `<div class="section"><h2>تنظیمات محلی</h2></div><div class="notice">این صفحه مدیریت سازمانی و کنترل دسترسی ندارد. تنظیمات فقط در همین مرورگر ذخیره می‌شود. برای نسخه تحت شبکه، احراز هویت، پایگاه داده و سرویس ارسال ایمیل لازم است.</div><div class="panel"><h3>گیرندگان ایمیل</h3><p class="muted">هر نشانی در یک خط؛ دکمه «آماده‌سازی ایمیل» برنامه ایمیل دستگاه را باز می‌کند. پیوست بریف را باید دستی اضافه کنید.</p><textarea id="recipients" class="field" style="width:100%;min-height:110px" placeholder="name@example.com">${esc(settings.recipients.join('\n'))}</textarea><div class="row" style="margin-top:12px"><button class="primary" onclick="saveRecipients()">ذخیره گیرندگان</button></div></div><div class="panel adminbox"><h3>داده‌های کاتالوگ</h3><p class="muted">خروجی پشتیبان بگیرید یا نسخه ویرایش‌شده داده خدمات را وارد کنید. تغییرات این دستگاه بر فایل اصلی اثر ندارد.</p><div class="row"><button class="ghost" onclick="download('market-services.json',JSON.stringify(services,null,2),'application/json')">دریافت داده خدمات</button><label class="ghost">ورود فایل JSON <input type="file" accept="application/json" hidden onchange="importServices(this)"></label><button class="ghost" onclick="if(confirm('داده خدمات به نسخه اصلی برگردد؟')){services=seed;save('services',services);draw()}">بازگشت به نسخه اصلی</button></div></div><div class="panel adminbox"><h3>پشتیبان درخواست‌ها</h3><button class="ghost" onclick="download('market-requests.json',JSON.stringify(requests,null,2),'application/json')">دریافت درخواست‌ها</button></div>`}
function saveRecipients(){let a=document.getElementById('recipients').value.split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean);if(a.some(x=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))){alert('یکی از نشانی‌ها معتبر نیست.');return}settings.recipients=[...new Set(a)];save('settings',settings);alert('گیرندگان در همین مرورگر ذخیره شدند.')}
async function importServices(input){let f=input.files?.[0];if(!f)return;try{let a=JSON.parse(await f.text());if(!Array.isArray(a)||a.length<1||a.some(x=>!x.code||!x.name||!x.family||!x.output)||new Set(a.map(x=>x.code)).size!==a.length)throw Error('ساختار خدمات معتبر نیست.');if(confirm('کاتالوگ محلی با فایل جدید جایگزین شود؟')){services=a;save('services',a);draw()}}catch(e){alert('فایل قابل ورود نیست: '+e.message)}}
draw();if(page==='catalog')renderCards();
const observer=new MutationObserver(()=>{if(page==='catalog'&&!selected&&document.getElementById('results')&&!document.getElementById('results').children.length)renderCards();if(page==='new'&&step===0){let p=document.getElementById('pick');if(p&&!p.dataset.bound){p.dataset.bound=1;p.addEventListener('change',()=>{let s=services.find(x=>x.code===p.value);document.getElementById('pickHelp').textContent=s?s.input:'مدارکی را که در اختیار دارید در مرحله بعد بنویسید.'})}}});observer.observe(document.getElementById('app'),{childList:true,subtree:false});
</script></body></html>
