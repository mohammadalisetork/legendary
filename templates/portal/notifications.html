{% extends 'base.html' %}{% load portal_tags %}{% block heading %}اعلان‌ها{% endblock %}{% block content %}<h1>اعلان‌ها</h1><div class="panel list">{% for n in items %}<form method="post" action="{% url 'notification_read' n.pk %}" class="notification {% if not n.read_at %}unread{% endif %}">{% csrf_token %}<div><b>{{ n.title }}</b><span>{{ n.body }}</span><small>{{ n.created_at|jdate }}</small></div><button class="secondary">{% if n.request %}مشاهده درخواست{% else %}خواندم{% endif %}</button></form>{% empty %}<div class="empty">اعلانی وجود ندارد.</div>{% endfor %}</div>{% endblock %}
