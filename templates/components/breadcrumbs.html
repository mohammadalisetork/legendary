{% if breadcrumbs %}<nav class="breadcrumbs" aria-label="مسیر صفحه"><ol>{% for crumb in breadcrumbs %}<li>{% if crumb.href and not forloop.last %}<a href="{{ crumb.href }}">{{ crumb.label }}</a>{% else %}<span{% if forloop.last %} aria-current="page"{% endif %}>{{ crumb.label }}</span>{% endif %}</li>{% endfor %}</ol></nav>{% endif %}
